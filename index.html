revBtn = document.getElementById('prev-btn');        const scoreElement = document.getElementById('score');        const progressBar = document.getElementById('progress-bar');        const gameContainer = document.getElementById('game-container');        const resultContainer = document.getElementById('result-container');        const finalScoreElement = document.getElementById('final-score');        const resultMessage = document.getElementById('result-message');        const restartBtn = document.getElementById('restart-btn');        const starsContainer = document.getElementById('stars-container');        const feedback = document.getElementById('feedback');        const celebration = document.getElementById('celebration');        let currentQuestion = 0;        let score = 0;        let answered = false;        let userAnswer = null;        function initGame() {            currentQuestion = 0;            score = 0;            answered = false;            userAnswer = null;            scoreElement.textContent = score;            gameContainer.style.display = 'block';            resultContainer.style.display = 'none';            feedback.textContent = '';            loadQuestion();        }        function loadQuestion() {            if (currentQuestion >= questions.length) {                endGame();                return;            }            const question = questions[currentQuestion];            questionText.textContent = question.question;            questionNumber.textContent = currentQuestion + 1;                        progressBar.style.width = `${(currentQuestion / questions.length) * 100}%`;                        answered = false;            userAnswer = null;            trueBtn.disabled = false;            falseBtn.disabled = false;            feedback.textContent = '';                        prevBtn.disabled = currentQuestion === 0;            nextBtn.disabled = true;        }        function selectAnswer(answer) {            if (answered) return;                        answered = true;            userAnswer = answer;            const question = questions[currentQuestion];                        trueBtn.disabled = true;            falseBtn.disabled = true;                        if (answer === question.answer) {                score++;                scoreElement.textContent = score;                feedback.textContent = "إجابة صحيحة! أحسنت!";                feedback.className = "feedback correct-feedback";            } else {                feedback.textContent = "إجابة خاطئة! الإجابة الصحيحة كانت: " + (question.answer ? "صح" : "خطأ");                feedback.className = "feedback incorrect-feedback";            }                        nextBtn.disabled = false;                        if (answer) {                trueBtn.classList.add('pulse');            } else {                falseBtn.classList.add('pulse');            }        }        function nextQuestion() {            if (!answered) {                alert("الرجاء اختيار إجابة قبل الانتقال للسؤال التالي");                return;            }                        trueBtn.classList.remove('pulse');            falseBtn.classList.remove('pulse');                        currentQuestion++;            loadQuestion();        }        function prevQuestion() {            currentQuestion--;            loadQuestion();        }        function endGame() {            gameContainer.style.display = 'none';            resultContainer.style.display = 'block';            finalScoreElement.textContent = score;                        const percentage = (score / questions.length) * 100;                        starsContainer.innerHTML = '';            const starCount = Math.ceil(percentage / 20);            for (let i = 0; i < 5; i++) {                const star = document.createElement('i');                star.classList.add('fas');                star.classList.add(i < starCount ? 'fa-star' : 'fa-star-half-alt');                starsContainer.appendChild(star);            }                        if (percentage >= 90) {                resultMessage.textContent = 'نتيجة رائعة! أنت خبير في المعلومات العامة.';                createConfetti();            } else if (percentage >= 70) {                resultMessage.textContent = 'نتيجة ممتازة! لديك معرفة جيدة في مختلف المجالات.';            } else if (percentage >= 50) {                resultMessage.textContent = 'نتيجة جيدة! يمكنك تحسين معرفتك بالمزيد من الدراسة.';            } else if (percentage >= 30) {                resultMessage.textContent = 'حاول مرة أخرى! ركز أكثر في دراستك.';            } else {                resultMessage.textContent = 'لا تيأس! استمر في التعلم وحاول مرة أخرى.';            }                        progressBar.style.width = '100%';        }        function createConfetti() {            celebration.style.display = 'block';            celebration.innerHTML = '';                        for (let i = 0; i < 100; i++) {                const confetti = document.createElement('div');                confetti.classList.add('confetti');                confetti.style.left = `${Math.random() * 100}%`;                confetti.style.backgroundColor = getRandomColor();                confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;                celebration.appendChild(confetti);            }                        setTimeout(() => {                celebration.style.display = 'none';            }, 5000);        }        function getRandomColor() {            const colors = ['#6c5ce7', '#fd79a8', '#00b894', '#fdcb6e', '#0984e3', '#e17055'];            return colors[Math.floor(Math.random() * colors.length)];        }
